name: ci

# Created by maelys-release v0.5.0 (0.5.0) and owned by this repository: add jobs
# next to check, keep check on the socle version of release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@a57c25b4429f22af3dfd3edd0a72b2d0514be19f # v0.44.0
    with:
      product: maelys-oci
      docs_contract: true
      check_command: |
        make check
        make analyze
      sanitizer_command: |
        make asan-ubsan
        make fuzz
