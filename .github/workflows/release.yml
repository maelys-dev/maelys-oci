name: release

# Managed by maelys-release untagged (0.46.1). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@393d676fe9d75f01fe7420bf333e205cc8798abd # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-oci
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependency.sh maelys-cli
        sh scripts/checkout-dependency.sh maelys-http
        sh scripts/checkout-dependency.sh maelys-json
        sh scripts/checkout-dependency.sh maelys-system
        sh scripts/checkout-dependency.sh mbedtls
      linux_packages: build-essential dpkg-dev file rpm cmake pkg-config python3 perl libarchive-dev libext2fs-dev comerr-dev e2fsprogs
      macos_packages: pkgconf libarchive e2fsprogs mbedtls python3

  tap-libmaelys-oci:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@393d676fe9d75f01fe7420bf333e205cc8798abd # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-oci
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT libmaelys-oci
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}

  tap-maelys-oci:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@393d676fe9d75f01fe7420bf333e205cc8798abd # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-oci
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-oci
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
